<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-600 min-h-screen flex items-center grid justify-center">
    <header class="items-center text-center p-4">
        <h1 class="text-xl font-bold font-mono">🎉Student Creativity Competition🎉</h1>
        <p class="dark:text-gray-400 font-serif">Showcase Your Creativity, Skills and Innovative Ideas</p>
    </header>
    <main class="border rounded-lg shadow-lg mb-6 p-8 bg-gray-500">
        <section class="pt-1 text-left">
            <form action="#" method="post" class="space-y-3">
                <div>
                    <label for="Name" class="font-semibold text-white">Name :</label>
                    <input type="text" class="w-full px-3 py-2 text-xs rounded border placeholder-gray-400" placeholder="Enter Your Full Name" required>
                </div>
                <div>
                    <label for="Name" class="font-semibold text-white">Class :</label>
                    <select name="" id= "" class="w-full px-3 rounded border text-xs" required >
                        <option value="" disabled selected>Select Your Class</option>
                        <option value="1">X</option>
                        <option value="2">XI</option>
                        <option value="3">XII</option>
                    </select>
                </div>
                <div>
                    <label for="" class="text-white font-semibold">Gender :</label>
                    <input type="radio" id="Male">
                    <label for="Male">Male</label>
                    <input type="radio" id="Female">
                    <label for="Female">Female</label>
                </div>
                <div>
                    <label for="Name" class="font-semibold text-white">Competition :</label>
                    <select name="" id= "" required class="w-full px-3 rounded border text-sm">
                        <option value="" disabled selected>Competition Category</option>
                        <option value="">Web Development</option>
                        <option value="">IoT Project</option>
                        <option value="">Graphic Design</option>
                        <option value="">Public Speaking</option>
                        <option value="">Photography</option>
                    </select>
                </div>
                <div>
                    <label for="" class="text-white font-semibold">Participant :</label>
                    <input type="radio">
                    <label for="Name">Individual</label>
                    <input type="radio">
                    <label for="Name">Team</label>
                </div>

                <div>
                    <label for="Name" class="font-semibold text-white">Team Name :</label>
                    <input type="text" placeholder="Enter Your Team's Name" required class="w-full rounded border">
                </div>
                <div>
                    <label for="Name" class="text-white font-semibold">Contact Number :</label>
                    <input type="number" placeholder="08xxxxxxxx" required class="rounded w-full border">
                </div>
                <div>
                    <label for="Name" class="font-semibold text-white">Project Description :</label>
                    <textarea name="" id="" placeholder="Describe your project or competition entry..." required class="w-full rounded border"></textarea>
                </div>
                <button type="submit" class="font-medium text-xs shadow bg-red-500 hover:bg-red-700 transition-colors text-white rounded border px-3 py-1">Register Now</button>
            </form>
        </section>
    </main>

    <table class="border border-gray-100 border-spacing-4 rounded text-center bg-gray-100">
        <tr class="border bg-red-600">
            <th class="p-4">No.</th>
            <th class="p-4">Participant</th>
            <th class="p-4">Class</th>
            <th class="p-4">Categoty</th>
            <th class="p-4">Team</th>
            <th class="p-4">Status</th>
        </tr>
        <tr class="border">
            <td class="p-4">1</td>
            <td class="p-4">Amba Rongawi</td>
            <td class="p-4">X</td>
            <td class="p-4">Public Speaking</td>
            <td class="p-4">Ngawi Jaya</td>
            <td class="p-4">Registered</td>
        </tr>
        <tr class="border">
            <td class="p-4">2</td>
            <td class="p-4">Rusdi Elekro</td>
            <td class="p-4">XI</td>
            <td class="p-4">IoT Project</td>
            <td class="p-4">Mojokerto Keras</td>
            <td class="p-4">Pending</td>
        </tr>
    </table>
</body>
</html>
